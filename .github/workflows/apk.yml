name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Accept Android SDK licenses
        run: |
          for m in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$m" ]; then yes | "$m" --licenses > /dev/null 2>&1 || true; fi
          done
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      - name: Build release
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo "### build errors" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|^> Task .* FAILED" build.log | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          grep -E "^e: |error:|^> Task .* FAILED" build.log | head -40 || echo "no compiler lines found"

      - name: Publish compiler errors to ci-logs
        if: failure()
        run: |
          {
            echo "run #${{ github.run_number }}  $(date -u +%FT%TZ)"
            grep -E "^e: |error:|^> Task .* FAILED" build.log | head -60
          } > build-errors.txt || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f android/build-errors.txt
          git commit -q -m "ci: build errors from run ${{ github.run_number }}" || true
          git push --force origin ci-logs || echo "could not push ci-logs"

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/tracker.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: tracker-apk
          path: android/out/tracker.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/tracker.apk
